[package]
name = "couch_rs"
version = { workspace = true }
authors = [
    "Mathieu Amiot <mathieu.amiot@yellowinnovation.fr>",
    "Marcel Ibes <mibes@mibesco.com>",
]
license = "MIT/Apache-2.0"
description = "CouchDB library for Rust"
readme = "README.md"
documentation = "https://docs.rs/couch_rs"
repository = "https://github.com/mibes/couch-rs"
keywords = ["couchdb", "orm", "database", "nosql"]
categories = ["database"]
edition = { workspace = true }
include = ["**/*.rs", "Cargo.toml"]
rust-version = { workspace = true }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
couch_rs_derive = { version = "0.13", optional = true, path = "../couch_rs_derive" }
url = "2.5.8"
tokio = { version = "^1.49.0", features = ["rt-multi-thread"] }
base64 = "0.22.1"
tokio-util = { version = "0.7.18", features = ["io"] }
bytes = "1.11.0"
tokio-stream = { version = "0.1.18", features = ["io-util"] }
futures-util = "0.3.31"
futures-core = "0.3.31"
percent-encoding = "2.3.2"
http = "1.4.0"

[dependencies.reqwest]
version = "0.13.1"
features = ["json", "gzip", "stream", "query"]
default-features = false

[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }

[features]
default = ["derive", "rustls-tls"]
integration-tests = []

# Provide derive(CouchDocument) macros.
derive = ["couch_rs_derive"]

# tls backend, copied from reqwest
native-tls = ["reqwest/native-tls"]
native-tls-no-alpn = ["reqwest/native-tls-no-alpn"]
native-tls-vendored-no-alpn = ["reqwest/native-tls-vendored-no-alpn"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
rustls-tls = ["reqwest/rustls"]
rustls-no-provider = ["reqwest/rustls-no-provider"]

[lib]
doctest = false

[lints]
workspace = true
